<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 Input Types</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>
<header class="site-header">
  <h1>HTML5 Input Types</h1>
  <p>Demonstrates email, date, number, and password input types with built-in validation.</p>
</header>
<main class="program-page">
  <nav class="crumbs"><a href="../index.html">Home</a><a href="index.html">HTML Programs</a></nav>

  <section class="demo">
    <form class="demo-form">
      <label for="e">Email input</label>
      <input type="email" id="e" placeholder="you@example.com">

      <label for="d">Date input</label>
      <input type="date" id="d">

      <label for="n">Number input</label>
      <input type="number" id="n" min="0" max="100" step="1">

      <label for="p">Password input</label>
      <input type="password" id="p" minlength="6">

      <label for="r">Range input</label>
      <input type="range" id="r" min="0" max="10">

      <label for="c">Color input</label>
      <input type="color" id="c" style="height:44px;">
    </form>
  </section>

  <footer class="nav-footer">
    <a href="../index.html">Home</a>
    <a href="index.html">HTML Programs</a>
  </footer>
</main>

</body>
</html>
