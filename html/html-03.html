<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tables with Rows, Columns, Borders & Merged Cells</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>
<header class="site-header">
  <h1>Tables with Rows, Columns, Borders & Merged Cells</h1>
  <p>Demonstrates a table using rowspan and colspan to merge cells.</p>
</header>
<main class="program-page">
  <nav class="crumbs"><a href="../index.html">Home</a><a href="index.html">HTML Programs</a></nav>

  <section class="demo">
    <table class="demo-table">
      <tr>
        <th colspan="3">Weekly Schedule</th>
      </tr>
      <tr>
        <th>Day</th>
        <th>Morning</th>
        <th>Afternoon</th>
      </tr>
      <tr>
        <td>Monday</td>
        <td rowspan="2">Mathematics</td>
        <td>Physics</td>
      </tr>
      <tr>
        <td>Tuesday</td>
        <td>Chemistry</td>
      </tr>
      <tr>
        <td>Wednesday</td>
        <td colspan="2">Sports / Free Period</td>
      </tr>
    </table>
  </section>

  <footer class="nav-footer">
    <a href="../index.html">Home</a>
    <a href="index.html">HTML Programs</a>
  </footer>
</main>

</body>
</html>
