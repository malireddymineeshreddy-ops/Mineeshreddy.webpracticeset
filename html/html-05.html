<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>
<header class="site-header">
  <h1>Student Registration Form</h1>
  <p>A registration form built using native HTML form elements.</p>
</header>
<main class="program-page">
  <nav class="crumbs"><a href="../index.html">Home</a><a href="index.html">HTML Programs</a></nav>

  <section class="demo">
    <form class="demo-form" onsubmit="alert('Form submitted (demo only)'); return false;">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="regno">Register Number</label>
      <input type="text" id="regno" name="regno" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob">

      <label for="gender">Gender</label>
      <select id="gender" name="gender">
        <option value="">-- Select --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>

      <label for="course">Course</label>
      <input type="text" id="course" name="course" placeholder="e.g. B.Tech CSE">

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3"></textarea>

      <button type="submit" class="btn">Register</button>
    </form>
  </section>

  <footer class="nav-footer">
    <a href="../index.html">Home</a>
    <a href="index.html">HTML Programs</a>
  </footer>
</main>

</body>
</html>
