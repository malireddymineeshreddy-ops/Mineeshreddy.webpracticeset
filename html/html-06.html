<!DOCTYPE html>
<html lang="en">
<head>

<title>Audio and Video Elements</title>
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>
<header class="site-header">
  <h1>Audio and Video Elements</h1>
  <p>Demonstrates the native audio and video HTML elements with controls.</p>
</header>
<main class="program-page">
  <nav class="crumbs"><a href="../index.html">Home</a><a href="index.html">HTML Programs</a></nav>

  <section class="demo">
    <h3>Audio</h3>
    <audio controls style="width:100%;">
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <h3>Video</h3>
    <video controls style="width:100%;max-width:480px;">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Your browser does not support the video element.
    </video>
  </section>

  <footer class="nav-footer">
    <a href="../index.html">Home</a>
    <a href="index.html">HTML Programs</a>
  </footer>
